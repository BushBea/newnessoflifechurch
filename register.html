<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create an Account | Newness of Life Church</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="section" style="padding-top:56px;">
      <div class="container">
        <div class="form-card narrow">
          <h1 class="center" style="font-size:28px">Create your account</h1>
          <p class="center text-muted" style="margin-bottom:22px">Join to track your giving history and stay connected.</p>
          <div class="form-msg" id="regMsg"></div>
          <form id="regForm">
            <div class="field">
              <label for="name">Full name</label>
              <input id="name" name="name" type="text" autocomplete="name" required>
            </div>
            <div class="field">
              <label for="email">Email address</label>
              <input id="email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
              <p class="hint">At least 8 characters.</p>
            </div>
            <div class="field">
              <label for="confirm">Confirm password</label>
              <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <button class="btn block" type="submit" id="regSubmit">Create account</button>
          </form>
          <p class="center text-muted" style="margin-top:18px">Already have an account? <a href="login.html" style="color:var(--sage-deep);font-weight:600">Log in</a></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script>
    const form = document.getElementById('regForm');
    const msg = document.getElementById('regMsg');
    const submitBtn = document.getElementById('regSubmit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFormMsg(msg);

      if (form.password.value !== form.confirm.value) {
        showFormMsg(msg, 'Passwords do not match.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account…';
      try {
        await api.register(form.name.value.trim(), form.email.value.trim(), form.password.value);
        window.location.href = 'account.html';
      } catch (err) {
        showFormMsg(msg, err.message || 'Could not create your account. Please try again.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create account';
      }
    });

    document.addEventListener('layout:ready', (e) => {
      const user = e.detail.user;
      if (user) window.location.href = user.role === 'admin' ? 'admin.html' : 'account.html';
    });
  </script>
</body>
</html>
