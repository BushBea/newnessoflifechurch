<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Events | Newness of Life Church</title>
  <meta name="description" content="See what's coming up at Newness of Life Church — community nights, youth camp, Bible study, and more." />
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero" style="padding-bottom: 56px;">
      <div class="container" style="grid-template-columns: 1fr; text-align:center; padding-bottom: 20px;">
        <div>
          <p class="hero-eyebrow">Stay connected</p>
          <h1 style="max-width:none">Upcoming events</h1>
          <p class="lead" style="margin:0 auto">From community nights to youth camp, here's what's coming up at Newness of Life.</p>
        </div>
      </div>
      <svg class="hero-wave" viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,40 C240,90 480,0 720,30 C960,60 1200,10 1440,45 L1440,80 L0,80 Z" fill="#faf6ee"></path>
      </svg>
    </section>

    <section class="section">
      <div class="container">
        <div id="featuredEvent"></div>
        <div id="eventList">
          <div class="empty-state">Loading events&hellip;</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script src="js/featured-event.js"></script>
  <script>
    document.getElementById('featuredEvent').innerHTML = renderPrayerGathering();

    const FALLBACK_EVENTS = [
      { title: 'Community Night', event_date: '2026-09-05', event_time: '6:30 PM', description: 'Join us for worship, fellowship, and dinner.' },
      { title: 'Youth Camp', event_date: '2026-09-12', event_time: 'All day', description: 'A fun-filled weekend for teens to grow in faith.' },
      { title: 'Weekly Bible Study', event_date: '2026-09-16', event_time: '7:00 PM', description: 'Dive deeper into Scripture with our small groups.' },
    ];

    function renderEvents(events) {
      const el = document.getElementById('eventList');
      if (!events.length) { el.innerHTML = '<div class="empty-state">No events scheduled yet — check back soon.</div>'; return; }
      const sorted = [...events].sort((a, b) => a.event_date.localeCompare(b.event_date));
      el.innerHTML = `<div class="timeline">` + sorted.map(ev => {
        const d = formatEventDate(ev.event_date);
        return `
        <div class="timeline-item">
          <div class="timeline-date"><span class="day">${d.day}</span><span class="mon">${d.mon}</span></div>
          <div class="timeline-content">
            <h3>${escapeHtml(ev.title)}</h3>
            <p class="when">${d.full || ''}${ev.event_time ? ' &middot; ' + escapeHtml(ev.event_time) : ''}</p>
            <p>${escapeHtml(ev.description || '')}</p>
          </div>
        </div>`;
      }).join('') + `</div>`;
    }

    (async () => {
      try {
        const { events } = await api.events();
        renderEvents(events.length ? events : FALLBACK_EVENTS);
      } catch (e) {
        renderEvents(FALLBACK_EVENTS);
      }
    })();
  </script>
</body>
</html>
