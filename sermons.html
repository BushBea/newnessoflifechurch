<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sermons | Newness of Life Church</title>
  <meta name="description" content="Watch and listen to recent sermons from Newness of Life Church." />
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <section class="hero" style="padding-bottom: 56px;">
      <div class="container" style="grid-template-columns: 1fr; text-align:center; padding-bottom: 20px;">
        <div>
          <p class="hero-eyebrow">Teaching</p>
          <h1 style="max-width:none">Sermons</h1>
          <p class="lead" style="margin:0 auto">Missed a Sunday, or want to revisit a message? Every recent sermon lives here.</p>
        </div>
      </div>
      <svg class="hero-wave" viewBox="0 0 1440 80" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,40 C240,90 480,0 720,30 C960,60 1200,10 1440,45 L1440,80 L0,80 Z" fill="#faf6ee"></path>
      </svg>
    </section>

    <section class="section">
      <div class="container">
        <div class="card-grid" id="sermonGrid">
          <div class="empty-state">Loading sermons&hellip;</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
  <script>
    const FALLBACK_SERMONS = [
      { title: 'Living with Faith', speaker: 'Pastor Nkosinathi Rhulani', duration: '28m', thumbnail: 'images/image1.jpg' },
      { title: 'Grace and Forgiveness', speaker: 'Pastor Nkosinathi Rhulani', duration: '31m', thumbnail: 'images/image2.jpg' },
      { title: 'Walking in Hope', speaker: 'Pastor Nkosinathi Rhulani', duration: '26m', thumbnail: 'images/image4.jpg' },
      { title: 'Strength in Unity', speaker: 'Pastor Nkosinathi Rhulani', duration: '34m', thumbnail: 'images/image5.jpg' },
    ];

    function renderSermons(sermons) {
      const el = document.getElementById('sermonGrid');
      if (!sermons.length) { el.innerHTML = '<div class="empty-state">No sermons posted yet — check back soon.</div>'; return; }
      el.innerHTML = sermons.map(s => `
        <article class="media-card">
          <a class="thumb" href="${s.video_url || 'https://www.youtube.com/@nkosinathirhulani195'}" target="_blank" rel="noopener noreferrer">
            <img src="${s.thumbnail || 'images/sermon.jpg'}" alt="${escapeHtml(s.title)}">
            <div class="play"><i class="fas fa-play"></i></div>
          </a>
          <div class="body">
            <h3>${escapeHtml(s.title)}</h3>
            <p class="meta">${escapeHtml(s.speaker)}${s.duration ? ' &middot; ' + escapeHtml(s.duration) : ''}</p>
            ${s.description ? `<p class="desc">${escapeHtml(s.description)}</p>` : ''}
          </div>
        </article>
      `).join('');
    }

    (async () => {
      try {
        const { sermons } = await api.sermons();
        renderSermons(sermons.length ? sermons : FALLBACK_SERMONS);
      } catch (e) {
        renderSermons(FALLBACK_SERMONS);
      }
    })();
  </script>
</body>
</html>
